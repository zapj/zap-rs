server {
    listen       80 default_server;
    server_name  _;
    access_log   off;
    
    location / {
        root   html;
        index  index.html index.htm;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}


server {
    listen       80 default_server;
    server_name  localhost;
    access_log   off;

    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}