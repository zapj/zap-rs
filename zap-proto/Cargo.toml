[package]
name = "zap-proto"
version.workspace = true
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["io-util"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
