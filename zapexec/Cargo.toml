[package]
name = "zapexec"
version = "0.1.0"
edition = "2024"

[dependencies]
zap-proto = { path = "../zap-proto" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
chrono = "0.4"
