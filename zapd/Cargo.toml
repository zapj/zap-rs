[package]
name = "zapd"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.6.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde = { version = "1.0.146", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.*"
sqlx = { version = "0.8", features = [ "runtime-tokio", "json", "sqlite","derive","time" ] }
hyper = { version = "1.7.0", features = ["full"] }
hyper-util = { version = "0.1.16", features = ["full"] }
tokio-rustls = "0.26.2"
tower-service = "0.3.3"

public-ip-address = { version = "0.3" }
lazy_static = "1.5.0"
httparse = "1.10"
rust-embed = "8.7.2"
mime_guess = "2.0.5"
local-ip-address = "0.6.5"
bcrypt = "0.17.1"
jsonwebtoken = "9.3.1"
axum-extra = { version = "0.10.1", features = ["typed-header"] }
thiserror = "2.0.16"
sysinfo = "0.37.0"
systemstat = "0.2.5"
humantime = "2.3.0"
chrono = "0.4.42"
human_bytes = { version = "0.4.3", default-features = false }
