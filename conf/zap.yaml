db:
  path: data/zap.db
exec:
  secret_path: /etc/zap/exec.key
  socket_path: /run/zap/exec.sock
jwt:
  jwt_expire: 3600
  jwt_secure: da8966cc5ad82529c56a75b9e7a03b2f9aec51ae381150a4360fdb49061b0c60
server:
  address: 0.0.0.0
  cert_file: conf/zap.crt
  key_file: conf/zap.key
  port: 2600
  # 统一 URL 前缀：设置后页面与接口全部位于 /<url_prefix>/ 下，
  # 例：https://host:2600/zap/dashboard、/zap/api/auth/login
  # 留空（删掉本行或置空）则不启用前缀，接口仍在 /api/*、页面在根路径
  url_prefix: ""
